<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Treino</title>
<meta name="theme-color" content="#f3f0e9"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Treino"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;--bg:#f3f0e9;--ink:#16171a;--mute:#66655f;--hot:#d7261e;--panel:#fffdf9}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(22,23,26,.07) 1px,transparent 0);background-size:22px 22px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);padding:20px}
form{width:min(380px,100%);background:var(--panel);border-radius:22px;padding:28px 24px;box-shadow:0 2px 4px rgba(40,30,20,.06),0 18px 44px rgba(40,30,20,.14);display:grid;gap:14px;animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.disc{width:64px;height:64px;border-radius:50%;background:var(--hot);box-shadow:inset 0 0 0 7px #9f1b15,inset 0 0 0 18px var(--hot),inset 0 0 0 21px #f08a84,inset 0 0 0 25px #222;margin-bottom:4px}
form.busy .disc{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
form.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
h1{margin:0;font-size:26px;line-height:1.1}
p{margin:0;color:var(--mute);font-size:15px}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input[type=password],input[type=text]{font:16px system-ui;padding:12px 14px;border:1px solid #e3ddd0;border-radius:12px;background:var(--bg);color:var(--ink);min-height:48px;width:100%}
input:focus{outline:none;border-color:var(--hot);box-shadow:0 0 0 3px rgba(215,38,30,.2)}
.rm{display:flex;align-items:center;gap:10px;font-weight:500}
.rm input{width:20px;height:20px;accent-color:var(--hot)}
button{font:700 16px system-ui;border:0;border-radius:999px;background:var(--ink);color:#fff;min-height:50px;cursor:pointer}
button:active{transform:scale(.97)}
#msg{min-height:22px;color:var(--hot);font-weight:600;font-size:14px}
</style></head><body>
<form id="f" autocomplete="on"><div class="disc"></div><h1>Treino</h1><p>Área privada. Digite a senha para abrir.</p>
<input type="text" name="username" value="painel-treino" autocomplete="username" hidden>
<label>Senha<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
<label class="rm"><input type="checkbox" id="rm" checked>Lembrar neste aparelho</label>
<button>Entrar</button><div id="msg" role="alert"></div></form>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(key){if(document.readyState!="complete")await new Promise(r=>addEventListener("load",()=>setTimeout(r,0),{once:true}));const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.i)},key,ub(P.c));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()}
async function derive(pw){const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(P.s),iterations:P.n,hash:"SHA-256"},b,{name:"AES-GCM",length:256},true,["decrypt"])}
(async()=>{try{const k=localStorage.getItem("pt-key");if(!k)return;const key=await crypto.subtle.importKey("raw",ub(k),"AES-GCM",false,["decrypt"]);await open_(key)}catch(e){try{localStorage.removeItem("pt-key")}catch(_){}}})();
const f=document.getElementById("f"),msg=document.getElementById("msg");
f.addEventListener("submit",async e=>{e.preventDefault();f.classList.add("busy");f.classList.remove("err");msg.textContent="";
 try{const key=await derive(document.getElementById("pw").value.trim());await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(P.i)},key,ub(P.c));
  if(document.getElementById("rm").checked){const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));try{localStorage.setItem("pt-key",btoa(String.fromCharCode(...raw)))}catch(_){}}
  await open_(key)}
 catch(err){f.classList.remove("busy");void f.offsetWidth;f.classList.add("err");msg.textContent="Senha incorreta."}});
</script></body></html>
